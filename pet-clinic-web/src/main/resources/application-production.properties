# Google OAuth values are supplied by the deployment environment.
google.oauth.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:https://thesis-tasiopoulos.com/auth/google/callback}

# The OAuth callback is a top-level navigation back from Google. Keeping the
# short-lived server session cookie explicit avoids losing the CSRF state at
# the reverse-proxy boundary while still preventing JavaScript access.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework

# Appointment values are clinic-local times. Use an explicit IANA time zone
# instead of the container default (UTC), including daylight-saving rules.
clinic.time-zone=${CLINIC_TIME_ZONE:Europe/Athens}

# File system locations
logging.file.name=/app/logs/petclinic.log
clinic.public-base-url=${CLINIC_PUBLIC_BASE_URL:https://thesis-tasiopoulos.com}
