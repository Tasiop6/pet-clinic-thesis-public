spring.banner.image.location=vizsla.jpg

# Internationalization
spring.messages.basename=messages/messages

spring.profiles.active=springdatajpa

spring.application.name=Happy Tails

# DataSource (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:3306/petclinic?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Database migrations
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Security
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Google Calendar integration (service account)
calendar.service-account.enabled=${CALENDAR_SERVICE_ACCOUNT_ENABLED:false}
calendar.service-account.key-path=${CALENDAR_SERVICE_ACCOUNT_KEY_PATH:}

calendar.service-account.calendar-id=${CALENDAR_SERVICE_ACCOUNT_CALENDAR_ID:primary}
calendar.service-account.use-delegation=${CALENDAR_SERVICE_ACCOUNT_USE_DELEGATION:false}

# Google OAuth for Calendar (defaults provided for local development)
google.oauth.client-id=${GOOGLE_CALENDAR_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:}
google.oauth.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/auth/google/callback}

# Appointment notifications
clinic.notifications.from=${CLINIC_NOTIFICATIONS_FROM:no-reply@petclinic.local}
clinic.public-base-url=${CLINIC_PUBLIC_BASE_URL:http://localhost:8080}
clinic.email-verification.token-hours=${EMAIL_VERIFICATION_TOKEN_HOURS:24}
clinic.password-reset.token-minutes=${PASSWORD_RESET_TOKEN_MINUTES:60}

# SPA routing compatibility with legacy Ant-style path matching
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Clinic imprint (used in prescriptions)
clinic.info.path=classpath:clinic-info.txt
