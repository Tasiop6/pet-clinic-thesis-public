name: Application CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "thesis/**"
      - "thesis-overleaf/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "thesis/**"
      - "thesis-overleaf/**"
      - "**/*.md"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify backend and frontend
        run: ./mvnw -B verify

  frontend-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pet-clinic-web/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: pet-clinic-web/frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=high
